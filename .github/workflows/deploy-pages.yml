name: 部署看板到 GitHub Pages

# 只要 main 分支有推送（包括 update-data.yml 自动提交的数据更新）就重新发布站点。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个 Pages 部署，避免相互覆盖
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: 拉取仓库
        uses: actions/checkout@v4

      - name: 配置 Pages
        uses: actions/configure-pages@v5

      - name: 打包 dashboard/ 目录为站点产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard

      - name: 发布
        id: deployment
        uses: actions/deploy-pages@v4