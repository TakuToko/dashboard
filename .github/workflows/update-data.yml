name: 采集数据并更新看板

# 手动触发：来自 GitHub 网页的 Run workflow 按钮。
on:
  workflow_dispatch:

# 需要写权限，才能把新生成的数据 commit 回仓库
permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取仓库
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 采集 + 预处理分析
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python run_all.py

      - name: 提交并推送更新后的看板数据
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard
          if git diff --cached --quiet; then
            echo "数据无变化，跳过提交"
          else
            git commit -m "chore(data): 自动更新看板数据 $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi

  # GITHUB_TOKEN 推送的提交不会触发 deploy-pages.yml，
  # 所以必须在这里的同一运行里再部署一次 Pages。
  # 打包与部署拆成独立 job（官方推荐结构）：部署 job 会在产物生成几秒后才查询，避免时序问题。
  package:
    needs: update
    runs-on: ubuntu-latest
    steps:
      - name: 拉取仓库（含刚提交的数据）
        uses: actions/checkout@v4
        with:
          ref: main

      - name: 配置 Pages
        uses: actions/configure-pages@v5

      - name: 打包 dashboard/ 目录为站点产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard

  deploy:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 发布到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4