name: Issue 触发采集

# 任何人在仓库里新建一个标题含「[采集]」的 Issue，就会自动跑一遍采集。
# 这样无需域名、无需后端、无跨域问题，GitHub 国内也能访问。
on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

# 同一时间只跑一个采集，避免并发互相覆盖数据
concurrency:
  group: collect-on-issue
  cancel-in-progress: false

jobs:
  collect:
    # 只有标题含 [采集] 的 Issue 才触发，避免误伤正常 Issue
    if: contains(github.event.issue.title, '[采集]')
    runs-on: ubuntu-latest
    steps:
      - name: 拉取仓库
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 采集 + 预处理分析
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python run_all.py

      - name: 提交并推送更新后的看板数据
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard
          if git diff --cached --quiet; then
            echo "数据无变化，跳过提交"
          else
            git commit -m "chore(data): Issue 触发采集 $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi

  # 打包与部署拆成独立 job（官方的推荐结构）：
  # 这样 deploy-pages 会在 artifact 生成几秒后才查询，避免"刚上传就查、列表里还没有"的时序问题。
  package:
    needs: collect
    runs-on: ubuntu-latest
    steps:
      - name: 拉取仓库（含刚提交的数据）
        uses: actions/checkout@v4
        with:
          ref: main

      - name: 配置 Pages
        uses: actions/configure-pages@v5

      - name: 打包 dashboard/ 目录为站点产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard

  deploy:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 发布到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  notify:
    needs: [collect, package, deploy]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: 回帖并关闭 Issue（成功）
        if: needs.collect.result == 'success' && needs.package.result == 'success' && needs.deploy.result == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment ${{ github.event.issue.number }} \
            -R ${{ github.repository }} \
            --body "✅ 采集完成，看板部署已发起。注意：GitHub Pages 有最长约 10 分钟的 CDN 缓存，部署不会立刻在页面生效——请等 2~3 分钟后回页面 Ctrl+F5 强刷（或换成无痕窗口）查看新版本；若仍是旧数据，再等几分钟即可。"
          gh issue close ${{ github.event.issue.number }} -R ${{ github.repository }}

      - name: 回帖（失败）
        if: needs.collect.result != 'success' || needs.package.result != 'success' || needs.deploy.result != 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment ${{ github.event.issue.number }} \
            -R ${{ github.repository }} \
            --body "❌ 本次采集失败，请到 Actions 查看日志：${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"