name: Issue 触发采集

# 任何人在仓库里新建一个标题含「[采集]」的 Issue，就会自动跑一遍采集。
# 这样无需域名、无需后端、无跨域问题，GitHub 国内也能访问。
on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

# 同一时间只跑一个采集，避免并发互相覆盖数据
concurrency:
  group: collect-on-issue
  cancel-in-progress: false

jobs:
  collect:
    # 只有标题含 [采集] 的 Issue 才触发，避免误伤正常 Issue
    if: contains(github.event.issue.title, '[采集]')
    runs-on: ubuntu-latest
    steps:
      - name: 拉取仓库
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 采集 + 预处理分析
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python run_all.py

      - name: 提交并推送更新后的看板数据
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard
          if git diff --cached --quiet; then
            echo "数据无变化，跳过提交"
          else
            git commit -m "chore(data): Issue 触发采集 $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi

  # 关键：这个 job 必须存在。
  # collect 用的是内置 GITHUB_TOKEN，而 GITHUB_TOKEN 推送的提交不会触发
  # deploy-pages.yml（GitHub 防止递归调用），所以站点不会自动重新部署。
  # 因此这里在「同一次运行」里自己再部署一次。
  deploy:
    needs: collect
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 拉取仓库（含刚提交的数据）
        uses: actions/checkout@v4
        with:
          ref: main

      - name: 配置 Pages
        uses: actions/configure-pages@v5

      - name: 打包 dashboard/ 目录为站点产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard

      - name: 发布
        id: deployment
        uses: actions/deploy-pages@v4

  notify:
    needs: [collect, deploy]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: 回帖并关闭 Issue（成功）
        if: needs.collect.result == 'success' && needs.deploy.result == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment ${{ github.event.issue.number }} \
            -R ${{ github.repository }} \
            --body "✅ 采集完成，看板已重新部署。回到页面 Ctrl+F5 强刷即可看到新版本。"
          gh issue close ${{ github.event.issue.number }} -R ${{ github.repository }}

      - name: 回帖（失败）
        if: needs.collect.result != 'success' || needs.deploy.result != 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment ${{ github.event.issue.number }} \
            -R ${{ github.repository }} \
            --body "❌ 本次采集失败，请到 Actions 查看日志：${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"